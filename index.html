<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Doraemon Backend Tester</title>

<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1a1d29;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-2: #1d4ed8;
    --danger: #dc2626;
    --danger-2: #b91c1c;
    --success: #16a34a;
    --border: #e5e7eb;
    --bubble-user: #2563eb;
    --bubble-user-text: #ffffff;
    --bubble-bot: #eef2ff;
    --bubble-bot-text: #1a1d29;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --card: #1a1d29;
      --text: #f1f2f6;
      --muted: #9aa0ac;
      --accent: #3b82f6;
      --accent-2: #60a5fa;
      --border: #2a2e3a;
      --bubble-user: #3b82f6;
      --bubble-user-text: #ffffff;
      --bubble-bot: #262a38;
      --bubble-bot-text: #f1f2f6;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  header {
    padding: 16px 16px 10px;
    text-align: center;
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.8rem; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    padding: 24px;
  }
  .empty-state .emoji { font-size: 2.5rem; display: block; margin-bottom: 8px; }
  .empty-state p { font-size: 0.85rem; line-height: 1.5; max-width: 280px; margin: 0 auto; }

  .bubble-row { display: flex; flex-direction: column; }
  .bubble-row.user { align-items: flex-end; }
  .bubble-row.bot { align-items: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 0.92rem;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 4px; }
  .bubble.bot { background: var(--bubble-bot); color: var(--bubble-bot-text); border-bottom-left-radius: 4px; }
  .bubble.bot .tag {
    display: block;
    font-size: 0.68rem;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 3px;
    letter-spacing: 0.02em;
  }
  .bubble.error { background: #fee2e2; color: #991b1b; border-bottom-left-radius: 4px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .bubble.error { background: #3f1616; color: #fca5a5; }
  }

  .meta-line { font-size: 0.68rem; color: var(--muted); margin-top: 4px; padding: 0 4px; }
  .response-time {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 4px;
  }

  .command-chip {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(37, 99, 235, 0.12);
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 700;
  }

  footer {
    flex-shrink: 0;
    padding: 10px 16px 16px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }

  .status-line {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
    min-height: 1.1em;
  }
  .status-line.recording { color: var(--danger); font-weight: 600; }
  .status-line.busy { color: var(--accent); font-weight: 600; }
  .status-line.live { color: var(--success); font-weight: 700; }

  .controls { display: flex; align-items: center; gap: 10px; }
  .text-fallback { flex: 1; display: flex; gap: 8px; }
  .text-fallback input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.9rem;
  }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send-btn:disabled { opacity: 0.5; cursor: default; }

  .mic-btn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.35);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .mic-btn.recording {
    background: var(--danger);
    box-shadow: 0 3px 14px rgba(220, 38, 38, 0.45);
    transform: scale(1.08);
    animation: pulse 1.2s infinite;
  }
  .mic-btn.live-active {
    background: var(--success);
    box-shadow: 0 3px 14px rgba(22, 163, 74, 0.5);
    transform: scale(1.08);
    animation: pulse-green 1.2s infinite;
  }
  .mic-btn:disabled { opacity: 0.5; cursor: default; }

  .sub-btn {
    width: 46px;
    height: 46px;
    font-size: 1.15rem;
    background: var(--bubble-bot);
    color: var(--accent);
    box-shadow: none;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.45); }
    70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
    100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
  }
  @keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5); }
    70% { box-shadow: 0 0 0 12px rgba(22, 163, 74, 0); }
    100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
  }

  .mode-toggle { text-align: center; margin-top: 10px; }
  .mode-toggle button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.75rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  .hidden { display: none !important; }
</style>
</head>

<body>

<header>
  <h1>🤖 Doraemon Backend Tester</h1>
  <p>Talk to your robot's brain directly — HTTP &amp; Gemini Live WebSocket</p>
</header>

<main id="chatArea">
  <div class="empty-state" id="emptyState">
    <span class="emoji">🎙️</span>
    <p>
      Tap <b>⚡</b> for real-time Gemini Live voice, <b>🎤</b> for standard voice, or type a message below.
    </p>
  </div>
</main>

<footer>
  <div class="status-line" id="statusLine"></div>

  <div class="controls" id="voiceControls">
    <button class="mic-btn" id="liveBtn" title="Toggle Gemini Live Real-Time Call">⚡</button>
    <button class="mic-btn sub-btn" id="micBtn" title="Record 1-shot audio">🎤</button>
    <button class="mic-btn sub-btn" id="uploadBtn" title="Upload an audio/video file">📁</button>

    <div class="text-fallback">
      <input type="text" id="textInput" placeholder="...or type a message" />
      <button class="send-btn" id="sendTextBtn">➤</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="audio/*,video/mp4,.mp4,.m4a,.wav,.mp3,.webm" class="hidden" />

  <div class="mode-toggle">
    <button id="clearChatBtn">Clear conversation &amp; stop music</button>
  </div>
</footer>

<script>
(function () {
  const BACKEND_BASE_URL = "https://robot-backend-flask-server--manishgupta80.replit.app";
  const DEVICE_TOKEN = "doraemonproject";

  const chatArea = document.getElementById('chatArea');
  const emptyState = document.getElementById('emptyState');
  const liveBtn = document.getElementById('liveBtn');
  const micBtn = document.getElementById('micBtn');
  const statusLine = document.getElementById('statusLine');
  const textInput = document.getElementById('textInput');
  const sendTextBtn = document.getElementById('sendTextBtn');
  const clearChatBtn = document.getElementById('clearChatBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const fileInput = document.getElementById('fileInput');

  let currentAudioPlayer = null;

  function getBaseUrl() {
    return BACKEND_BASE_URL.replace(/\/+$/, '');
  }

  function getWsUrl() {
    return getBaseUrl().replace(/^http/, 'ws') + '/ws/live?token=' + encodeURIComponent(DEVICE_TOKEN);
  }

  function clearEmptyState() {
    if (emptyState && emptyState.parentNode) {
      emptyState.remove();
    }
  }

  function stopAllAudio() {
    if (currentAudioPlayer) {
      currentAudioPlayer.pause();
      currentAudioPlayer.currentTime = 0;
      currentAudioPlayer = null;
    }
  }

  function playDirectAudio(url) {
    stopAllAudio();
    currentAudioPlayer = new Audio(url);
    currentAudioPlayer.play().catch((err) => {
      console.warn("Audio playback prevented or failed:", err);
      addBubble('bot', 'Tap here to begin audio playback 🎵', { meta: 'Tap to start' });
    });
  }

  function playDoraemonSong(track) {
    const songUrl = getBaseUrl() + '/song?track=' + encodeURIComponent(track || 'random');
    playDirectAudio(songUrl);
  }

  function playBase64Audio(b64) {
    if (!b64) return false;
    try {
      stopAllAudio();
      currentAudioPlayer = new Audio("data:audio/wav;base64," + b64);
      currentAudioPlayer.play().catch(() => {});
      return true;
    } catch (e) {
      return false;
    }
  }

  function formatResponseTime(milliseconds) {
    const seconds = milliseconds / 1000;
    return seconds < 1 ? Math.round(milliseconds) + ' ms' : seconds.toFixed(2) + ' s';
  }

  function addBubble(role, text, opts) {
    opts = opts || {};
    clearEmptyState();

    const row = document.createElement('div');
    row.className = 'bubble-row ' + (role === 'user' ? 'user' : 'bot');

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (opts.error ? 'error' : role);

    if (role === 'bot' && !opts.error) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'Doraemon';
      bubble.appendChild(tag);
    }

    const textNode = document.createElement('span');
    textNode.textContent = text;
    bubble.appendChild(textNode);

    if (opts.commandType && opts.commandType !== 'none') {
      const chip = document.createElement('span');
      chip.className = 'command-chip';
      const detail = opts.direction || opts.track || '';
      chip.textContent = '⚙ command: ' + opts.commandType + (detail ? ' (' + detail + ')' : '');
      bubble.appendChild(document.createElement('br'));
      bubble.appendChild(chip);
    }

    row.appendChild(bubble);

    if (role === 'bot' && !opts.error && typeof opts.responseTime === 'number') {
      const responseTime = document.createElement('div');
      responseTime.className = 'response-time';
      responseTime.textContent = '⚡ ' + formatResponseTime(opts.responseTime);
      row.appendChild(responseTime);
    }

    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function setStatus(text, mode) {
    statusLine.textContent = text || '';
    statusLine.className = 'status-line' + (mode ? ' ' + mode : '');
  }

  function speak(text) {
    try {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }

  // ---------- Gemini Live WebSocket Mode ----------
  let liveWs = null;
  let liveAudioCtx = null;
  let liveMediaStream = null;
  let liveProcessor = null;
  let nextPlayTime = 0;
  let isLiveActive = false;

  async function startLiveSession() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      addBubble('bot', 'Microphone not supported on this browser.', { error: true });
      return;
    }

    setStatus('Connecting to Gemini Live WebSocket...', 'busy');
    liveBtn.disabled = true;

    try {
      liveMediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
      });
    } catch (err) {
      addBubble('bot', 'Microphone access failed: ' + err.name, { error: true });
      setStatus('');
      liveBtn.disabled = false;
      return;
    }

    liveAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    nextPlayTime = liveAudioCtx.currentTime;

    liveWs = new WebSocket(getWsUrl());
    liveWs.binaryType = 'arraybuffer';

    liveWs.onopen = () => {
      setStatus('Connected! Waiting for Gemini Live session...', 'busy');
    };

    liveWs.onmessage = async (event) => {
      if (typeof event.data === 'string') {
        try {
          const msg = JSON.parse(event.data);
          if (msg.event === 'ready') {
            isLiveActive = true;
            liveBtn.disabled = false;
            liveBtn.classList.add('live-active');
            liveBtn.textContent = '⏹';
            setStatus('🟢 LIVE CALL ACTIVE — Speak anytime! (Tap ⏹ to end)', 'live');
            addBubble('bot', '⚡ Gemini Live connected! Speak directly into your mic.');
            startMicStreaming();
          } else if (msg.event === 'command' && msg.command) {
            const cmd = msg.command;
            addBubble('bot', 'Executed live tool command:', {
              commandType: cmd.type,
              direction: cmd.direction,
              track: cmd.track
            });
            if (cmd.type === 'play_song') {
              playDoraemonSong(cmd.track);
            }
          }
        } catch (e) {}
      } else if (event.data instanceof ArrayBuffer) {
        playPcmChunk(event.data);
      }
    };

    liveWs.onerror = () => {
      addBubble('bot', 'Live WebSocket connection error.', { error: true });
      stopLiveSession();
    };

    liveWs.onclose = () => {
      if (isLiveActive) {
        addBubble('bot', 'Live session ended.');
      }
      stopLiveSession();
    };
  }

  function startMicStreaming() {
    if (!liveAudioCtx || !liveMediaStream) return;
    const source = liveAudioCtx.createMediaStreamSource(liveMediaStream);
    liveProcessor = liveAudioCtx.createScriptProcessor(4096, 1, 1);

    const inputSampleRate = liveAudioCtx.sampleRate;
    const targetSampleRate = 16000;

    liveProcessor.onaudioprocess = (e) => {
      if (!isLiveActive || !liveWs || liveWs.readyState !== WebSocket.OPEN) return;
      const inputData = e.inputBuffer.getChannelData(0);
      const ratio = inputSampleRate / targetSampleRate;
      const outLength = Math.floor(inputData.length / ratio);
      const pcm16 = new Int16Array(outLength);

      for (let i = 0; i < outLength; i++) {
        const sample = Math.max(-1, Math.min(1, inputData[Math.floor(i * ratio)]));
        pcm16[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
      }
      liveWs.send(pcm16.buffer);
    };

    source.connect(liveProcessor);
    liveProcessor.connect(liveAudioCtx.destination);
  }

  function playPcmChunk(arrayBuffer) {
    if (!liveAudioCtx) return;
    const int16 = new Int16Array(arrayBuffer);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) {
      float32[i] = int16[i] / 32768.0;
    }

    const audioBuffer = liveAudioCtx.createBuffer(1, float32.length, 24000);
    audioBuffer.getChannelData(0).set(float32);

    const source = liveAudioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(liveAudioCtx.destination);

    const now = liveAudioCtx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now;
    source.start(nextPlayTime);
    nextPlayTime += audioBuffer.duration;
  }

  function stopLiveSession() {
    isLiveActive = false;
    liveBtn.disabled = false;
    liveBtn.classList.remove('live-active');
    liveBtn.textContent = '⚡';
    setStatus('');

    if (liveProcessor) {
      liveProcessor.disconnect();
      liveProcessor = null;
    }
    if (liveMediaStream) {
      liveMediaStream.getTracks().forEach((t) => t.stop());
      liveMediaStream = null;
    }
    if (liveWs) {
      try { liveWs.close(); } catch (e) {}
      liveWs = null;
    }
    if (liveAudioCtx) {
      try { liveAudioCtx.close(); } catch (e) {}
      liveAudioCtx = null;
    }
  }

  liveBtn.addEventListener('click', () => {
    if (isLiveActive || liveWs) stopLiveSession();
    else startLiveSession();
  });

  // ---------- Standard HTTP Chat & Listen ----------
  async function pollJobStatus(baseUrl, jobId, maxAttempts) {
    maxAttempts = maxAttempts || 25;
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      await new Promise((resolve) => setTimeout(resolve, 1000));
      try {
        const resp = await fetch(baseUrl + '/listen/status?job_id=' + encodeURIComponent(jobId));
        const data = await resp.json();
        if (data.status === 'pending') continue;
        return { ok: resp.ok, data };
      } catch (err) {
        return { ok: false, data: { error: 'Could not reach backend: ' + err.message } };
      }
    }
    return { ok: false, data: { error: 'Timed out waiting for a reply.' } };
  }

  async function sendToListen(blob, mimeType, label) {
    const baseUrl = getBaseUrl();
    const startTime = performance.now();

    addBubble('user', label || '🎤 (voice message)');
    setStatus('Uploading...', 'busy');

    micBtn.disabled = true;
    uploadBtn.disabled = true;
    sendTextBtn.disabled = true;

    try {
      const resp = await fetch(baseUrl + '/listen', {
        method: 'POST',
        headers: { 'Content-Type': mimeType || 'audio/webm' },
        body: blob,
      });

      const data = await resp.json();
      if (!resp.ok) {
        addBubble('bot', data.error || ('Server error (' + resp.status + ')'), { error: true });
        return;
      }

      if (data.status === 'pending' && data.job_id) {
        setStatus('Doraemon is thinking...', 'busy');
        const result = await pollJobStatus(baseUrl, data.job_id);
        if (!result.ok) {
          addBubble('bot', result.data.error || 'Waiting for reply failed.', { error: true });
          return;
        }

        const finalData = result.data;
        if (finalData.heard) {
          const heardRow = document.createElement('div');
          heardRow.className = 'meta-line';
          heardRow.style.textAlign = 'right';
          heardRow.textContent = 'Heard: "' + finalData.heard + '"';
          chatArea.appendChild(heardRow);
        }

        const cmd = finalData.command || {};
        const responseTime = performance.now() - startTime;

        addBubble('bot', finalData.response || '(no reply text)', {
          commandType: cmd.type,
          direction: cmd.direction,
          track: cmd.track,
          responseTime: responseTime
        });

        if (cmd.type === 'play_song') {
          playDoraemonSong(cmd.track);
        } else if (!playBase64Audio(finalData.reply_audio_base64) && finalData.response) {
          speak(finalData.response);
        }
      }
    } catch (err) {
      addBubble('bot', 'Could not reach backend: ' + err.message, { error: true });
    } finally {
      setStatus('');
      micBtn.disabled = false;
      uploadBtn.disabled = false;
      sendTextBtn.disabled = false;
    }
  }

  async function sendTextMessage(message) {
    const baseUrl = getBaseUrl();
    const startTime = performance.now();

    addBubble('user', message);
    setStatus('Doraemon is thinking...', 'busy');

    micBtn.disabled = true;
    sendTextBtn.disabled = true;

    try {
      const resp = await fetch(baseUrl + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message }),
      });

      const data = await resp.json();
      if (!resp.ok) {
        addBubble('bot', data.error || ('Server error (' + resp.status + ')'), { error: true });
      } else {
        const cmd = data.command || {};
        const responseTime = performance.now() - startTime;

        addBubble('bot', data.response || '(no reply text)', {
          commandType: cmd.type,
          direction: cmd.direction,
          track: cmd.track,
          responseTime: responseTime
        });

        if (cmd.type === 'play_song') {
          playDoraemonSong(cmd.track);
        } else if (!playBase64Audio(data.reply_audio_base64) && data.response) {
          speak(data.response);
        }
      }
    } catch (err) {
      addBubble('bot', 'Could not reach backend: ' + err.message, { error: true });
    } finally {
      setStatus('');
      micBtn.disabled = false;
      sendTextBtn.disabled = false;
    }
  }

  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let stream = null;

  async function startRecording() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      addBubble('bot', 'Microphone access failed: ' + err.name, { error: true });
      return;
    }

    audioChunks = [];
    let mimeType = 'audio/webm';
    if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mimeType = 'audio/webm;codecs=opus';
      else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
    }

    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      const finalType = mediaRecorder.mimeType || mimeType;
      const blob = new Blob(audioChunks, { type: finalType });
      if (blob.size > 0) sendToListen(blob, finalType);
    };

    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
    setStatus('Recording... tap again to stop', 'recording');
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) mediaRecorder.stop();
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
  }

  micBtn.addEventListener('click', () => {
    if (isRecording) stopRecording();
    else startRecording();
  });

  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    sendToListen(file, file.type || 'audio/webm', '📁 ' + file.name);
  });

  sendTextBtn.addEventListener('click', () => {
    const msg = textInput.value.trim();
    if (!msg) return;
    textInput.value = '';
    sendTextMessage(msg);
  });

  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendTextBtn.click();
  });

  clearChatBtn.addEventListener('click', () => {
    stopAllAudio();
    stopLiveSession();
    chatArea.innerHTML = '';
  });
})();
</script>

</body>
</html>
